{% extends 'first/base.html' %}

{% block title %}
Авторизация
{% endblock %}

{% block content %}
    <h1>Авторизация</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-2">
                <p>Логин:</p>
                <p>Пароль:</p>
            </div>
            <div class="col-md-4">
                <input name="username" type="text" placeholder="Введите логин" class="form-control">
                <input name="password" type="text" placeholder="Введите пароль" class="form-control">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    {{ login_error }}
{% endblock %}
