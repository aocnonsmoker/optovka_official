{% load static %}
<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" type="text/css" href="{% static '/css/style.css' %}">
        <link rel="stylesheet" href="{% static '/css/bootstrap.min.css' %}">
        <script src="{% static '/js/jquery-3.5.1.min.js' %}"></script>
        <script src="{% static '/js/popper.min.js' %}"></script>
        <script src="{% static '/js/main.js' %}"></script>
        <script src="{% static '/js/bootstrap.min.js' %}"></script>
        <title>{% block title %}{% endblock %}</title>

    </head>
    <body>
        <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
          <h5 class="my-0 mr-md-auto font-weight-normal"><a href="">Optovka</a></h5>
          <nav class="mr-md-3 nav nav-pills nav-justified">
              <a class="nav-item nav-link {% if '/' == request.path %}active{% endif %}" href="">Главная</a>
              <a class="nav-item nav-link {% if '/catalog' == request.path %}active{% endif %}" href="">Каталог</a>
              <a class="nav-item nav-link {% if '/basket' == request.path %}active{% endif %}" href="">Корзина</a>
              {% if request.user.is_authenticated %}
                <div class="btn-group">
                    <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                      {{ request.user }}
                    </button>
                    <div class="dropdown-menu">
                      <a class="dropdown-item" href="">Профиль</a>
                      <a class="dropdown-item" href="#">Настройки</a>
                      <div class="dropdown-divider"></div>
                      <a class="dropdown-item" href="">Выйти</a>
                    </div>
                  </div>
              {% else %}
                <a class="nav-item nav-link {% if '/login' == request.path %}active{% endif %}" href="">Войти</a>
              {% endif %}
          </nav>
        </div>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
