{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Optovka.kz</title>
    <link href="{% static '/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static '/css/font-awesome.min.css' %}" rel="stylesheet">
    <link href="{% static '/css/prettyPhoto.css' %}" rel="stylesheet">
    <link href="{% static '/css/animate.css' %}" rel="stylesheet">
	<link href="{% static '/css/main.css' %}" rel="stylesheet">
	<link href="{% static '/css/responsive.css' %}" rel="stylesheet">  
</head>
<body>
    <header id="header"><!--header-->
		<div class="header-middle"><!--header-middle-->
			<div class="container">
				<div class="row">
					<div class="col-sm-4">
						<div class="logo pull-left">
							<a href="{% url 'shop' %}"><img src="{% static '/images/home/logo.png' %}" alt="" /></a>
						</div>
					</div>
					<div class="col-sm-8 text-center">
						<div class="shop-menu">
							<ul class="nav navbar-nav">
								<li><a href="#"><i class="fa fa-user"></i> Профиль</a></li>
								<li><a href="#"><i class="fa fa-star"></i> Избранные</a></li>
								<li><a href="#"><i class="fa fa-shopping-cart"></i> Корзина</a></li>
								<li><a href="#"><i class="fa fa-sign-out"></i> Выйти</a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div><!--/header-middle-->
	
		<div class="header-bottom"><!--header-bottom-->
			<div class="container">
				<div class="row">
					<div class="col-sm-3">
						<div class="search_box pull-right">
							<input type="text" placeholder="Search"/>
						</div>
					</div>
					<div class="col-sm-9">
						<div class="navbar-header">
							<button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
								<span class="sr-only">Toggle navigation</span>
								<span class="icon-bar"></span>
								<span class="icon-bar"></span>
								<span class="icon-bar"></span>
							</button>
						</div>
						<div class="mainmenu pull-left">
							<ul class="nav navbar-nav collapse navbar-collapse">
								<li><a href="{% url 'shop' %}" class="active">Главная</a></li>
								<li><a href="{% url 'cart:cart_detail' %}">Корзина</a></li> 
								<li><a href="#">История заказов</a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div><!--/header-bottom-->
	</header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer id="footer"><!--Footer-->
	
		<div class="footer-bottom">
			<div class="container">
				<div class="row">
					<p class="pull-left">Copyright © 2020 Optovka.kz | All rights reserved.</p>
					<p class="pull-right">Developed by Zhambyl Kairken</span></p>
				</div>
			</div>
		</div>
		
    </footer><!--/Footer-->
    
    <script src="{% static '/js/jquery.js' %}"></script>
	<script src="{% static '/js/bootstrap.min.js' %}"></script>
	<script src="{% static '/js/bootstrap.min.js' %}"></script>
    <script src="{% static '/js/jquery.prettyPhoto.js' %}"></script>
    <script src="{% static '/js/main.js' %}"></script>
</body>
</html>
