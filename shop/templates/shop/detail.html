{% extends 'first/base.html' %}

{% block title %}
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-12 col-lg-9">
            <div class="row">
                <div class="col-12 col-sm-12">

                </div>
                <div class="col-sm-12 col-md-8 product-detail">
                    <article class="product_content">
                        <h1 class="product-h1">
                            {{ product.name }}
                        </h1>
                        <div class="row">
                            <div class="col-12 col-md-7">
                                <div class="product-image">
                                    <img src="/media/{{product.image}}" height="280" width="280">
                                </div>
                            </div>
                            <div class="col-12 col-md-5">
                                <div class="product-price">
                                    <div>
                                        <b>{{ product.price }}</b>
                                        <small>₸</small>
                                    </div>
                                    <form action="{% url 'cart:cart_add' product.id %}" method="post">
                                        {{ cart_product_form }}
                                        {% csrf_token %}
                                        <input type="submit" value="Add to cart">
                                    </form>
                                </div>
                            </div>
                            <div class="col-sm-12">
                                <h1>
                                    {{ product.description }}
                                </h1>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
        </div>
        <div class="col-lg-3 cart-column"></div>
    </div>
{% endblock %}
